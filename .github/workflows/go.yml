name: Go

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Test
      run: go test -v ./...

    - name: Test (default tgo mode)
      run: go test -tags defaulttgo -v ./...
